# Netlify configuration

[build]
  publish = "dist"
  command = "npm run build"

# Принудительный редирект на нашу страницу /thanks/ после обработки формы.
# Если Netlify не подхватит action= с формы — это запасной механизм.
[[redirects]]
  from = "/.netlify/functions/sf-default-thank-you"
  to = "/thanks/"
  status = 302
  force = true
